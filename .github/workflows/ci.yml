name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the prereg gate reads each PREREG.md's first commit
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: ruff
        run: uv run ruff check src tests && uv run ruff format --check src tests
      - name: mypy
        run: uv run mypy

  gates:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the prereg gate reads each PREREG.md's first commit
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: unit tests (round trip, property-based agreement, generators)
        run: uv run pytest -q
      - name: drift check
        run: uv run monograph check drift
      - name: breaking-change check
        run: uv run monograph check breaking
      - name: validator lint
        run: uv run monograph check lint
      - name: agreement (fixtures, probes, real openFDA records)
        run: uv run monograph check agreement
      - name: PREREG immutability
        run: uv run monograph check prereg

  integration:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: monograph
          POSTGRES_PASSWORD: monograph
          POSTGRES_DB: monograph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monograph -d monograph"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      MONOGRAPH_PG_DSN: postgresql://monograph:monograph@localhost:5432/monograph
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the prereg gate reads each PREREG.md's first commit
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Postgres integration
        run: uv run pytest -q -m integration

  age:
    # H2: backend equivalence and read-only roles against PostgreSQL 18 + Apache AGE 1.8.0. A service
    # container cannot take a command, and AGE must be preloaded for non-superuser roles, so it is started here.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      MONOGRAPH_AGE_DSN: postgresql://monograph:monograph@localhost:5433/monograph
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the prereg gate reads each PREREG.md's first commit
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: start Postgres + AGE
        run: |
          docker run -d --name age -p 5433:5432 \
            -e POSTGRES_USER=monograph -e POSTGRES_PASSWORD=monograph -e POSTGRES_DB=monograph \
            apache/age:release_PG18_1.8.0@sha256:47a0b054c3663a3e64a25fc0c5a982f1b58348019274b326a691cdf77f78eb58 \
            postgres -c shared_preload_libraries=age
          for i in $(seq 1 60); do docker exec age pg_isready -U monograph -d monograph && break; sleep 1; done
      - name: AGE tests
        run: uv run pytest -q -m age

  mutation:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: monograph
          POSTGRES_PASSWORD: monograph
          POSTGRES_DB: monograph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monograph -d monograph"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      MONOGRAPH_PG_DSN: postgresql://monograph:monograph@localhost:5432/monograph
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the prereg gate reads each PREREG.md's first commit
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: mutation suite
        run: uv run monograph mutate
      - name: measurements and report
        if: always()
        run: uv run monograph measure && uv run monograph report h6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h6-results-${{ github.run_id }}
          path: |
            results/h6/
            docs/h6/RESULTS.md
