services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: monograph
      POSTGRES_PASSWORD: monograph
      POSTGRES_DB: monograph
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monograph -d monograph"]
      interval: 2s
      timeout: 3s
      retries: 30
  age:
    # PostgreSQL 18.6 with Apache AGE 1.8.0, the official image, pinned by digest.
    image: apache/age:release_PG18_1.8.0@sha256:47a0b054c3663a3e64a25fc0c5a982f1b58348019274b326a691cdf77f78eb58
    command: ["postgres", "-c", "shared_preload_libraries=age"]
    environment:
      POSTGRES_USER: monograph
      POSTGRES_PASSWORD: monograph
      POSTGRES_DB: monograph
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monograph -d monograph"]
      interval: 2s
      timeout: 3s
      retries: 30
