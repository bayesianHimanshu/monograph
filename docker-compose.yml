services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: monograph
      POSTGRES_PASSWORD: monograph
      POSTGRES_DB: monograph
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monograph -d monograph"]
      interval: 2s
      timeout: 3s
      retries: 30
