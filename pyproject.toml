[project]
name = "monograph"
version = "0.1.0"
description = "MONOGRAPH H6: one Pydantic schema projected to OWL, SHACL, JSON Schema and Postgres DDL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.14.0",
    "httpx>=0.28",
    "hypothesis>=6.100",
    "mcp>=2.3",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10,<3",
    "pyshacl>=0.30",
    "rdflib>=7.1",
    "typer>=0.15",
]

[project.scripts]
monograph = "monograph.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PL", "PT"]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004", "PLC0415", "UP046", "UP047", "N818"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pyshacl", "pyshacl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a running Postgres (make it)",
    "age: needs the Postgres + Apache AGE service (make age-it)",
]
addopts = "-m 'not integration and not age' --strict-markers"
